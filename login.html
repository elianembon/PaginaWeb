<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Indie Games Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .login-container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .login-logo {
            width: 100px;
            margin-bottom: 2rem;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        
        .divider::before {
            margin-right: 1rem;
        }
        
        .divider::after {
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar (igual que en index.html) -->
    
    <main class="container my-5">
        <div class="login-container">
            <div class="text-center mb-4">
                <img src="../assets/images/logo-small.png" alt="Indie Games Studio" class="login-logo">
                <h1 class="h3 mb-3 fw-bold">Iniciar sesión</h1>
                <p class="text-muted">Ingresa a tu cuenta para acceder a todas las funciones</p>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                            <div class="invalid-feedback">
                                Por favor ingresa un correo electrónico válido.
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" required>
                            <div class="invalid-feedback">
                                Por favor ingresa tu contraseña.
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Recordarme</label>
                            </div>
                            <a href="#" class="small text-muted">¿Olvidaste tu contraseña?</a>
                        </div>
                        
                        <button class="w-100 btn btn-primary btn-lg" type="submit">Iniciar sesión</button>
                        
                        <div class="divider">
                            <span class="text-muted">o</span>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <a href="#" class="btn btn-outline-dark">
                                <i class="fab fa-google me-2"></i> Continuar con Google
                            </a>
                            <a href="#" class="btn btn-outline-dark">
                                <i class="fab fa-discord me-2"></i> Continuar con Discord
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-muted">¿No tienes una cuenta? <a href="register.html" class="text-primary">Regístrate</a></p>
            </div>
        </div>
    </main>
    
    <!-- Footer (igual que en index.html) -->
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
